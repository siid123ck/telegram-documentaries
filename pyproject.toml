[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-documentaries"
version = "0.1.0"
description = "A Telegram bot that turns portraits into comedy wildlife documentaries."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21",
    "pydantic>=2",
    "pydantic-settings>=2",
    "google-adk>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["telegram_documentaries"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
